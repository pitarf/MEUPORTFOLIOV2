name: Deploy Contínuo na VPS (Docker + Git)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy na VPS Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ env.VPS_HOST != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Ajuste o caminho se a pasta na sua VPS for diferente
            cd ~/MEUPORTFOLIOV2 || cd /var/www/MEUPORTFOLIOV2 || cd ~/portfolio
            bash deploy/deploy-vps.sh
