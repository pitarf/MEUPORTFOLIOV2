# ==============================================================================
# Configuração de Proxy Reverso Nginx na VPS Hostinger / Oracle Cloud
# Caminho na VPS: /etc/nginx/sites-available/rafaelpitaoficial.conf
# Ativação: ln -s /etc/nginx/sites-available/rafaelpitaoficial.conf /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Domínio Principal & Subdomínios (Portfólio, PIT.AI e Fotografia)
# ------------------------------------------------------------------------------
server {
    server_name rafaelpitaoficial.com.br www.rafaelpitaoficial.com.br pitai.rafaelpitaoficial.com.br fotografia.rafaelpitaoficial.com.br;

    # Cabeçalhos de Segurança (OWASP Recommended)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamanho máximo de upload de arquivos (ex: fotos de projetos/comprovantes)
    client_max_body_size 25M;

    # Logs de acesso e erro
    access_log /var/log/nginx/rafaelpita_access.log;
    error_log /var/log/nginx/rafaelpita_error.log;

    # Proxy Reverso para o container Docker (portfolio-web) na porta 3002
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # Preserva o Host original intacto para que o subdomínio pitai.* seja reconhecido
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets / Upgrade em tempo real
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de alta estabilidade
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Bloco SSL gerenciado pelo Certbot (será preenchido automaticamente ao rodar certbot)
    listen 80;
    listen [::]:80;
}
