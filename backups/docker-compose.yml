services:
  portfolio-db:
    image: postgres:15-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_secure_pass_2026
      POSTGRES_DB: portfolio_db
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-net

  portfolio-api:
    image: postgrest/postgrest:latest
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      portfolio-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://authenticator:pita_secure_authenticator_2026@portfolio-db:5432/portfolio_db"
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_JWT_SECRET: "pita_super_secure_jwt_secret_token_32chars_min_2026"
      PGRST_CORS_ALLOWED_ORIGINS: "*"
      PGRST_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:3025:3000"
    networks:
      - portfolio-net

volumes:
  portfolio-postgres-data:
    name: portfolio-postgres-data

networks:
  portfolio-net:
    name: portfolio-net
    driver: bridge
