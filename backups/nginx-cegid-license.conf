# Configuração do Proxy Reverso Nginx na VPS Oracle Cloud
# Arquivo: /etc/nginx/sites-available/cegid-license.conf
# Atualizado em 25/09/2026: Inclui suporte à API do Portfólio (/api/ e /rest/v1/)

server {
    server_name license.rafaelpitaoficial.com.br;

    # Cabeçalhos de Segurança (OWASP Recommended)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limite de tamanho de upload
    client_max_body_size 10M;

    # Rota 1: PostgREST API do Portfólio (Compatível com @supabase/supabase-js)
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3025/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota 2: Alias /api/ para consultas diretas do Portfólio
    location /api/ {
        proxy_pass http://127.0.0.1:3025/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota Raiz: Servidor de Licenciamento CEGID
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/license.rafaelpitaoficial.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/license.rafaelpitaoficial.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = license.rafaelpitaoficial.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name license.rafaelpitaoficial.com.br;
    return 404; # managed by Certbot
}
