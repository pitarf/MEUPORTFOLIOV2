server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Oculta versão do Nginx
    server_tokens off;

    # Compressão Gzip de Alta Eficiência
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cabeçalhos de Segurança (OWASP Recommended)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache agressivo e imutável para arquivos compilados com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Cache de imagens públicas, fontes e ícones
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Endpoint de verificação de integridade (Health Check)
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # DNS Resolver para proxies seguros de notícias e inteligência em tempo real
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Proxy direto para Notícias do Rio de Janeiro (Google News)
    location /api/news/rio {
        proxy_pass https://news.google.com/rss/search?q=Rio+de+Janeiro&hl=pt-BR&gl=BR&ceid=BR:pt-419;
        proxy_ssl_server_name on;
        proxy_set_header Host news.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        add_header Cache-Control "public, max-age=180";
        add_header Access-Control-Allow-Origin *;
    }

    # Proxy direto para Busca de Notícias em Tempo Real
    location /api/news/search {
        proxy_pass https://news.google.com/rss/search?$args;
        proxy_ssl_server_name on;
        proxy_set_header Host news.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        add_header Cache-Control "public, max-age=180";
        add_header Access-Control-Allow-Origin *;
    }

    # Proxy para RSS do G1 Rio de Janeiro
    location /api/news/g1-rio {
        proxy_pass https://g1.globo.com/rss/g1/rio-de-janeiro/;
        proxy_ssl_server_name on;
        proxy_set_header Host g1.globo.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin *;
    }

    # Proxy para TTS do Google (Áudio de Alta Fidelidade Natural)
    location /api/tts/google {
        proxy_pass https://translate.google.com/translate_tts?$args;
        proxy_ssl_server_name on;
        proxy_set_header Host translate.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
    }

    # Roteamento Single Page Application (SPA) para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página de erro customizada
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
