version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Frontend & Sistema Web (Portfólio, Landing Pages, Radar Maps & PIT.AI)
  # ----------------------------------------------------------------------------
  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
        VITE_VPS_MONITOR_API_URL: ${VITE_VPS_MONITOR_API_URL}
        VITE_VPS_MONITOR_TOKEN: ${VITE_VPS_MONITOR_TOKEN}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      # Porta restrita à interface de loopback para segurança contra acessos externos diretos
      - "127.0.0.1:${PORTFOLIO_WEB_PORT:-3002}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rp-network

  # ----------------------------------------------------------------------------
  # Banco de Dados Dedicado do PIT.AI (PostgreSQL 16 Alpine com Volume Persistente)
  # ----------------------------------------------------------------------------
  pitai-db:
    image: postgres:16-alpine
    container_name: pitai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PITAI_DB_USER:-pitai_admin}
      POSTGRES_PASSWORD: ${PITAI_DB_PASSWORD:-pitai_secure_pass_2026}
      POSTGRES_DB: ${PITAI_DB_NAME:-pitai_db}
    ports:
      - "127.0.0.1:${PITAI_DB_PORT:-5434}:5432"
    volumes:
      # Volume mapeado persistente para blindagem contra perda de dados em updates
      - pitai_postgres_data:/var/lib/postgresql/data
      - ./deploy/pitai/init-pitai-db.sql:/docker-entrypoint-initdb.d/01-init-pitai.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PITAI_DB_USER:-pitai_admin} -d ${PITAI_DB_NAME:-pitai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rp-network

volumes:
  # Volume Mapeado Obrigatório conforme as Diretrizes Mestres
  pitai_postgres_data:
    name: pitai_postgres_data

networks:
  rp-network:
    name: rp-network
    driver: bridge
